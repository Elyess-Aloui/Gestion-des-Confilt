{% extends 'base.html' %}

{% block title %}Ajouter une Classe - {{ school.nom }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-2 mb-3">
                <a href="{% url 'class_list' school.id %}" class="btn btn-sm btn-outline-secondary">← Retour</a>
                <h4 class="fw-bold text-dark mb-0">Ajouter une Classe</h4>
            </div>
            <p class="text-secondary small mb-4">Établissement : <strong>{{ school.nom }}</strong></p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small">Niveau scolaire</label>
                    {{ form.niveau }}
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Nom de la classe</label>
                    {{ form.nom }}
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'class_list' school.id %}" class="btn btn-outline-secondary w-50">Annuler</a>
                    <button type="submit" class="btn btn-primary-custom w-50">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

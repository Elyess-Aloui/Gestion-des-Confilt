{% extends 'base.html' %}

{% block title %}Éditer la Matière{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-2 mb-3">
                <a href="{% url 'matiere_list' %}" class="btn btn-sm btn-outline-secondary">← Retour</a>
                <h4 class="fw-bold text-dark mb-0">Éditer la Matière</h4>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small">Nom de la matière <span class="text-danger">*</span></label>
                    {{ form.nom }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Niveau(x) associé(s) <span class="text-danger">*</span></label>
                    <div class="border rounded p-3 bg-light">
                        {% for choice in form.niveaux %}
                        <div class="form-check mb-1">
                            {{ choice.tag }}
                            <label class="form-check-label" for="{{ choice.id_for_label }}">{{ choice.choice_label }}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Volume horaire hebdomadaire (heures max/semaine) <span class="text-danger">*</span></label>
                    {{ form.volume_horaire }}
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'matiere_list' %}" class="btn btn-outline-secondary w-50">Annuler</a>
                    <button type="submit" class="btn btn-primary-custom w-50">Mettre à jour</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
